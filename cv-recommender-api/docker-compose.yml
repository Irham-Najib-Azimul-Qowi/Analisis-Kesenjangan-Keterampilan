version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cv-recommender-api-backend
    ports:
      - "8080:8080"
    volumes:
      - ./models:/app/models
    environment:
      - PORT=8080
      - API_KEY=
      - ALLOWED_ORIGINS=["*"]
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: cv-recommender-api-dashboard
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8080
    restart: unless-stopped
    depends_on:
      - backend
